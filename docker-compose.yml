# docker-compose.yml defines all the service (containers) your app needs to run and starts them locally all with a single commend

# What each service does and why it's here:
#
# zookeeper — Kafka's behind-the-scenes manager — tracks which Kafka servers are alive and stores metadata about topics. You never interact with it directly, it just needs to be running before Kafka starts.
#
# kafka — The event broker. Vehicles publish telemetry events to Kafka topics; the consumer and Flink job read from those topics. Kafka decouples producers from consumers — if the consumer is slow or down, events are held safely in Kafka until it catches up.
#
# postgres — Persistent storage for raw telemetry events, Flink aggregations, and users. The consumer writes raw events here; the Flink job writes aggregated windows here; the REST API reads from here.
#
# flink-jobmanager — the brain. You submit a streaming job to it (like "compute rolling averages of vehicle speed"), and it breaks that job into tasks and assigns them to workers. The dashboard at localhost:8081 lets you monitor running jobs.
#
# flink-taskmanager — The Flink worker. It actually executes the stream processing tasks assigned by the JobManager. In production you'd run multiple TaskManagers for parallelism; one is enough for local development.

services:
  zookeeper:
   # The official Confluent Zookeeper image, version 7.6.1 (compatible with our Kafka version). 
    image: confluentinc/cp-zookeeper:7.6.1
    # Config vals passed into the container at startup - similar to .env
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    # controls startup order — Kafka needs Zookeeper to be running first, so we declare that dependency here. Docker Compose will start Zookeeper before Kafka and wait until it's healthy before starting Kafka.
    depends_on:
      - zookeeper
    ports:
      # 9092 is exposed to the host so our Node.js app (running outside Docker) can connect.
      # Inside the Docker network, services use port 29092 via the INTERNAL listener.
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT for internal container-to-container traffic,
      # PLAINTEXT_HOST for traffic coming from the host machine (our Node.js app).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      # These three variables are read directly by the official postgres image on first start to create the database and superuser. They match the values in .env.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume so DB data persists across docker-compose down/up cycles.
      # Without this, every restart wipes the database.
      - postgres_data:/var/lib/postgresql/data

  flink-jobmanager:
    image: flink:1.18-scala_2.12
    ports:
      # Flink web dashboard — submit jobs and monitor running tasks at localhost:8081
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

volumes:
  # Declaring the volume here makes it managed by Docker Compose.
  # Data survives container restarts but is removed with: docker-compose down -v
  postgres_data:
